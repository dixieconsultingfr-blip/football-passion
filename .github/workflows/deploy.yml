name: 🚀 Deploy to Hostinger

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    name: Trigger Hostinger auto-deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🔔 Notify Hostinger webhook
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.HOSTINGER_WEBHOOK_URL }}")
          echo "Hostinger webhook response: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Déploiement déclenché avec succès"
          else
            echo "❌ Erreur webhook : code $HTTP_CODE"
            exit 1
          fi
