name: 🚀 Deploy to Hostinger

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    name: Trigger Hostinger auto-deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ✅ Valider les données JSON (bloque le déploiement si erreur)
        run: python3 scripts/validate-data.py

      - name: 🧬 Contrôle du contenu dupliqué (avertissement uniquement, ne bloque jamais)
        continue-on-error: true
        run: |
          python3 scripts/check-duplicate-content.py --seuil 10 | tee dup.txt || true
          if grep -qE "^(DOUBLON|A REFORMULER)" dup.txt; then
            echo "::warning title=Contenu dupliqué détecté::$(grep -E '^(DOUBLON|A REFORMULER)' dup.txt | head -5 | tr '\n' ' ')"
          fi

      - name: 🔔 Notify Hostinger webhook
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' "${{ secrets.HOSTINGER_WEBHOOK_URL }}")
          echo "Hostinger webhook response: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Déploiement déclenché avec succès"
          else
            echo "❌ Erreur webhook : code $HTTP_CODE"
            exit 1
          fi
